name: 🐛 Bug report
description: Report something that isn't working as expected
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please search existing issues first.
        **Do not report security vulnerabilities here** — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: When I…, Helix…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce it?
      placeholder: |
        1. Go to…
        2. Click on…
        3. See error
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL / page
      description: Where did this happen?
      placeholder: https://helixstudio.org/…
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Landing / marketing
        - Editor / workspace
        - AI agents / chat
        - Deployments
        - Auth / billing
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, device, and (if self-hosting) Node version.
      placeholder: Chrome 124 · macOS 15 · MacBook Pro
  - type: textarea
    id: logs
    attributes:
      label: Console / network logs
      description: Paste any relevant errors. This will be formatted as code.
      render: shell
