version: 2
# Keep the starter templates' dependencies current. Dependabot opens PRs; the
# refresh-templates build-gate (and CI) is what proves a bump is safe before it
# reaches users. Scoped to the npm/pip template dirs.
#
# `groups` bundles each template's bumps into ONE weekly PR (instead of one per
# dependency) to cut review noise. express stays pinned to v4 until the
# express-api starter is validated on v5 — remove the ignore below to take it.
updates:
  - package-ecosystem: "npm"
    directory: "/templates/nextjs-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(templates)"
    groups:
      nextjs-app:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/templates/vite-spa"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(templates)"
    groups:
      vite-spa:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/templates/express-api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(templates)"
    groups:
      express-api:
        patterns: ["*"]
    ignore:
      # Hold express on v4 until the starter is validated on v5 (breaking API).
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/templates/flask-api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(templates)"
    groups:
      flask-api:
        patterns: ["*"]
