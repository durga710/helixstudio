name: Refresh templates

# Weekly auto-refresh of the scaffold starters from each framework's official
# CLI, build-gated, then auto-committed to main on green (per project decision).
# A template that doesn't build green is left unchanged — main never gets a
# broken starter. Commits use the owner git identity so the resulting Vercel
# deploy stays authorized.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-templates
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure git identity (owner)
        run: |
          git config user.name "Sishir P"
          git config user.email "reyghim1093@gmail.com"

      - name: Install Helix deps (for the registry generator)
        run: npm ci

      - name: Regenerate + build-gate CLI templates
        run: node scripts/refresh-templates.mjs

      - name: Rebuild the bundled registry
        run: npm run gen:templates

      - name: Commit on change (auto-merge to main)
        run: |
          if git diff --quiet -- templates src/lib/templates/registry.generated.ts; then
            echo "No template changes this week."
            exit 0
          fi
          git add templates src/lib/templates/registry.generated.ts
          git commit -m "chore(templates): weekly refresh — build-verified"
          git push origin main
