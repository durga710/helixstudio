<!doctype html>
<html lang="en" data-theme="midnight">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Helix App</title>
    <!-- Tailwind via CDN: works in the live preview, no build step. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Colors read CSS variables, so the palette in style.css re-themes the whole app.
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg: "var(--bg)", surface: "var(--surface)", surface2: "var(--surface-2)",
              line: "var(--border)", ink: "var(--text)", muted: "var(--text-muted)",
              brand: "var(--primary)", "brand-fg": "var(--primary-fg)", accent: "var(--accent)",
            },
            fontFamily: { sans: ["ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "Roboto", "Helvetica", "Arial", "sans-serif"] },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="style.css" />
    <!-- Premium libs (CDN, global builds — render in the live preview, no build step):
         Alpine (interactivity), AOS (scroll animations), Chart.js (charts), lucide (icons). -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  </head>
  <body class="min-h-screen bg-bg font-sans text-ink antialiased">
    <!-- ===================== LOGIN / SIGNUP (optional) ====================== -->
    <!-- Hidden by default — the app opens directly. This is kept so "add login"
         is a small step later; it is NOT the entry gate. -->
    <section id="view-auth" class="hidden min-h-screen place-items-center px-4 grid">
      <div class="w-full max-w-sm">
        <div class="mb-6 flex items-center justify-center gap-2">
          <span class="grid h-9 w-9 place-items-center rounded-xl bg-brand text-brand-fg font-bold">H</span>
          <span class="text-lg font-semibold" data-app-name>Helix App</span>
        </div>
        <div class="rounded-2xl border border-line bg-surface p-6 shadow-xl">
          <h1 id="auth-title" class="text-xl font-semibold">Welcome back</h1>
          <p id="auth-sub" class="mt-1 text-sm text-muted">Sign in to continue.</p>
          <form id="auth-form" class="mt-5 space-y-3">
            <div id="name-field" class="hidden">
              <label class="mb-1 block text-xs font-medium text-muted">Name</label>
              <input name="name" type="text" autocomplete="name" class="w-full rounded-lg border border-line bg-surface2 px-3 py-2 text-sm outline-none focus:border-brand" placeholder="Jane Doe" />
            </div>
            <div>
              <label class="mb-1 block text-xs font-medium text-muted">Email</label>
              <input name="email" type="email" required autocomplete="email" class="w-full rounded-lg border border-line bg-surface2 px-3 py-2 text-sm outline-none focus:border-brand" placeholder="you@example.com" />
            </div>
            <div>
              <label class="mb-1 block text-xs font-medium text-muted">Password</label>
              <input name="password" type="password" required autocomplete="current-password" class="w-full rounded-lg border border-line bg-surface2 px-3 py-2 text-sm outline-none focus:border-brand" placeholder="••••••••" />
            </div>
            <button type="submit" class="w-full rounded-lg bg-brand px-4 py-2.5 text-sm font-semibold text-brand-fg transition hover:brightness-110">
              <span id="auth-submit">Sign in</span>
            </button>
          </form>
          <p class="mt-4 text-center text-xs text-muted">
            <span id="auth-switch-text">New here?</span>
            <button id="auth-switch" class="font-medium text-brand hover:underline">Create an account</button>
          </p>
        </div>
        <p class="mt-4 text-center text-xs text-muted">
          <button id="guest-link" class="hover:underline">Continue as a guest →</button>
        </p>
      </div>
    </section>

    <!-- ================================ APP SHELL ============================== -->
    <!-- Shown by default — the project opens straight to the app. -->
    <div id="view-app" class="min-h-screen lg:grid lg:grid-cols-[240px_1fr]">
      <!-- Sidebar -->
      <aside class="hidden border-r border-line bg-surface lg:flex lg:flex-col">
        <div class="flex items-center gap-2 px-5 py-4">
          <span class="grid h-8 w-8 place-items-center rounded-lg bg-brand text-brand-fg font-bold">H</span>
          <span class="font-semibold" data-app-name>Helix App</span>
        </div>
        <nav class="flex-1 space-y-1 px-3 py-2 text-sm" id="side-nav">
          <button data-nav="dashboard" class="nav-item flex w-full items-center gap-2.5 rounded-lg px-3 py-2 text-left"><i data-lucide="layout-dashboard" class="h-[18px] w-[18px]"></i> <span>Dashboard</span></button>
          <button data-nav="settings" class="nav-item flex w-full items-center gap-2.5 rounded-lg px-3 py-2 text-left"><i data-lucide="settings" class="h-[18px] w-[18px]"></i> <span>Settings</span></button>
        </nav>
        <div class="border-t border-line p-3">
          <button id="logout" class="flex w-full items-center gap-2.5 rounded-lg px-3 py-2 text-left text-sm text-muted hover:text-ink"><i data-lucide="log-out" class="h-[18px] w-[18px]"></i> <span>Log out</span></button>
        </div>
      </aside>

      <div class="flex min-h-screen flex-col">
        <!-- Topbar -->
        <header class="flex items-center gap-3 border-b border-line bg-surface/60 px-5 py-3 backdrop-blur">
          <h1 id="page-title" class="text-base font-semibold">Dashboard</h1>
          <div class="ml-auto flex items-center gap-2">
            <select id="theme-select" title="Theme" class="rounded-lg border border-line bg-surface2 px-2 py-1.5 text-xs outline-none focus:border-brand"></select>
            <!-- Alpine dropdown (client interactivity, no build step). -->
            <div x-data="{ open: false }" class="relative">
              <button id="avatar" @click="open = !open" class="grid h-8 w-8 place-items-center rounded-full bg-accent text-brand-fg text-xs font-semibold">JD</button>
              <div x-show="open" @click.outside="open = false" x-cloak class="absolute right-0 z-10 mt-2 w-44 rounded-xl border border-line bg-surface p-1 text-sm shadow-lg">
                <button data-nav="settings" @click="open = false" class="nav-item block w-full rounded-lg px-3 py-2 text-left">Settings</button>
              </div>
            </div>
          </div>
        </header>

        <main class="flex-1 overflow-y-auto p-5">
          <!-- DASHBOARD PAGE -->
          <section data-page="dashboard">
            <div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-4">
              <!-- AI: these stat cards are placeholders — relabel them for the app's real metrics -->
              <div class="rounded-xl border border-line bg-surface p-4"><div class="text-xs text-muted">Total</div><div class="mt-1 text-2xl font-bold">1,248</div></div>
              <div class="rounded-xl border border-line bg-surface p-4"><div class="text-xs text-muted">Active</div><div class="mt-1 text-2xl font-bold">312</div></div>
              <div class="rounded-xl border border-line bg-surface p-4"><div class="text-xs text-muted">This week</div><div class="mt-1 text-2xl font-bold">+18%</div></div>
              <div class="rounded-xl border border-line bg-surface p-4"><div class="text-xs text-muted">Pending</div><div class="mt-1 text-2xl font-bold">7</div></div>
            </div>

            <div class="mt-4 rounded-xl border border-line bg-surface p-5" data-aos="fade-up">
              <h2 class="text-sm font-semibold">Overview</h2>
              <p class="mt-0.5 text-xs text-muted">A themed Chart.js chart — it recolors with the palette.</p>
              <div class="mt-3 h-48"><canvas id="dash-chart"></canvas></div>
            </div>

            <!-- ===================================================================
                 AI: BUILD THE APP'S MAIN FEATURE HERE.
                 This is the primary content region. Replace the placeholder below
                 with the user's actual app (list, board, form, table, chart, etc.).
                 Reuse the components in this template (cards, buttons, .nav-item,
                 inputs) and the bg-surface / border-line / bg-brand color tokens.
                 =================================================================== -->
            <div class="mt-4 rounded-xl border border-line bg-surface p-6">
              <h2 class="text-sm font-semibold">Get started</h2>
              <p class="mt-1 text-sm text-muted">Your content will appear here.</p>
              <div class="mt-4 flex gap-2">
                <button class="rounded-lg bg-brand px-3.5 py-2 text-sm font-semibold text-brand-fg transition hover:brightness-110">Primary action</button>
                <button class="rounded-lg border border-line bg-surface2 px-3.5 py-2 text-sm transition hover:border-brand">Secondary</button>
              </div>
            </div>
          </section>

          <!-- SETTINGS PAGE -->
          <section data-page="settings" class="hidden">
            <div class="max-w-lg rounded-xl border border-line bg-surface p-6">
              <h2 class="text-sm font-semibold">Profile</h2>
              <form id="settings-form" class="mt-4 space-y-3">
                <div>
                  <label class="mb-1 block text-xs font-medium text-muted">Name</label>
                  <input name="name" id="set-name" class="w-full rounded-lg border border-line bg-surface2 px-3 py-2 text-sm outline-none focus:border-brand" />
                </div>
                <div>
                  <label class="mb-1 block text-xs font-medium text-muted">Email</label>
                  <input name="email" id="set-email" class="w-full rounded-lg border border-line bg-surface2 px-3 py-2 text-sm outline-none focus:border-brand" />
                </div>
                <button class="rounded-lg bg-brand px-3.5 py-2 text-sm font-semibold text-brand-fg transition hover:brightness-110">Save changes</button>
                <span id="saved-note" class="ml-2 hidden text-xs text-brand">Saved ✓</span>
              </form>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
